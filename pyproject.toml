[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrate"
version = "1.0.4"
description = "Audio Steganography & Forensic Tool — Hide and reveal spoken messages in music"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jawad Amin" }
]
keywords = ["audio", "steganography", "forensics", "sound", "dsp", "encryption", "watermark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jawad/ghostrate"

[project.scripts]
ghostrate = "ghostrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghostrate*"]

